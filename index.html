<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>80抽極限刮刮樂 - 終極持久化修正版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: #121212; color: #fff; padding: 15px; 
      display: flex; flex-direction: column; align-items: center; 
      user-select: none; -webkit-user-select: none;
    }
    h1 { color: #fcc419; margin-bottom: 8px; font-size: 22px; text-align: center; }
    
    .status-bar { 
      background: #222; border: 1px solid #fcc419; padding: 10px 16px; 
      border-radius: 20px; margin: 10px 0; color: #fff; font-size: 14px; 
      box-shadow: 0 0 10px rgba(252, 196, 25, 0.2); text-align: center; width: 100%; max-width: 600px;
    }
    .status-bar span { color: #fcc419; font-weight: bold; font-size: 18px; margin: 0 4px; }
    .status-bar.preview { border-color: #888; color: #aaa; box-shadow: none; }
    
    .dashboard {
      background: #1e1e1e; border: 1px solid #333; border-radius: 10px;
      padding: 12px; width: 100%; max-width: 600px; margin-bottom: 15px;
    }
    .dashboard h3 { color: #fcc419; font-size: 13px; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .rate-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    .rate-table th { color: #aaa; padding: 4px; }
    .rate-table td { padding: 4px; border-bottom: 1px solid #2a2a2a; }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      max-width: 600px;
      width: 100%;
    }
    
    .card-slot {
      position: relative;
      aspect-ratio: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 11px;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
    }

    .slot-number { position: absolute; color: #666; font-size: 10px; top: 2px; left: 3px; }
    .prize-text { display: none; word-break: break-all; line-height: 1.2; font-size: 10px; padding: 2px; }

    /* 已刮開狀態 */
    .card-slot.revealed { background: #1a2310; border-color: #52c41a; }
    .card-slot.revealed .prize-text { display: block; }
    .card-slot.revealed .slot-number { display: none; }

    canvas { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      cursor: pointer; touch-action: none; -webkit-touch-callout: none;
    }

    .debug-bar {
      margin-top: 15px; font-size: 11px; color: #777; background: #1a1a1a;
      padding: 6px 12px; border-radius: 4px; border: 1px dashed #444; width: 100%; max-width: 600px; text-align: center;
    }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999;
    }
    .modal-content { background: #222; padding: 20px; border-radius: 12px; border: 1px solid #fcc419; text-align: center; max-width: 300px; width: 80%; }
    .btn { background: #fcc419; color: #000; border: none; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>🔥 豪華 80 刮尊爵限定卡</h1>
  <div class="status-bar" id="statusBar">載入中...</div>

  <div class="dashboard">
    <h3>📊 80 刮即時配率面板</h3>
    <table class="rate-table">
      <thead>
        <tr><th>獎項</th><th>數量</th><th>機率</th></tr>
      </thead>
      <tbody id="rateTableBody"></tbody>
    </table>
  </div>

  <div class="grid-container" id="grid"></div>
  <div class="debug-bar" id="debugBar">除錯資訊載入中...</div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle">提示</h3>
      <p id="modalMsg" style="margin: 15px 0; font-size: 15px; color: #fcc419;"></p>
      <button class="btn" onclick="closeModal()">確認</button>
    </div>
  </div>

<script>
  const SECRET_KEY = "MyLucky2026Key";

  // 1. 固定獎項設定
  const prizeConfig = [
    { rank: "特等獎", name: "🥇 iPad Air 256G", count: 1, color: "#ff4d4f" },
    { rank: "頭獎",   name: "🥈 $1,000 禮券",    count: 4, color: "#ffa940" },
    { rank: "貳獎",   name: "🥉 $200 禮券",      count: 10, color: "#ffec3d" },
    { rank: "普獎",   name: "🎁 免費飲料兌換券",  count: 20, color: "#73d13d" },
    { rank: "銘謝",   name: "☘️ 銘謝惠顧",       count: 45, color: "#8c8c8c" }
  ];

  // 2. 偽隨機數生成器（確保 80 格的獎項位置固定，不隨頁面重載改變）
  function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  // 產生 80 格固定的獎項配置
  let rawPrizes = [];
  prizeConfig.forEach(p => {
    for(let i = 0; i < p.count; i++) rawPrizes.push(p.name);
  });
  
  let prizeMap = [];
  let seed = 20260426;
  let tempPrizes = [...rawPrizes];
  while(tempPrizes.length > 0) {
    let index = Math.floor(seededRandom(seed++) * tempPrizes.length);
    prizeMap.push(tempPrizes.splice(index, 1)[0]);
  }

  // 渲染配率表
  const rateTableBody = document.getElementById('rateTableBody');
  prizeConfig.forEach(p => {
    const rate = ((p.count / 80) * 100).toFixed(2);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td style="color: ${p.color};">${p.name}</td><td>${p.count}</td><td>${rate}%</td>`;
    rateTableBody.appendChild(tr);
  });

  // Token 防偽驗證
  function generateToken(countStr) {
    const combined = countStr + SECRET_KEY;
    let hash = 0;
    for (let i = 0; i < combined.length; i++) {
      hash = (hash * 31 + combined.charCodeAt(i)) % 1000000;
    }
    return hash.toString(16);
  }

  const urlParams = new URLSearchParams(window.location.search);
  const countParam = urlParams.get('count') || "0";
  const tokenParam = urlParams.get('token') || "";

  let maxAllowed = 0;
  let isValid = false;

  if (countParam !== "0" && tokenParam === generateToken(countParam)) {
    maxAllowed = parseInt(countParam, 10);
    isValid = true;
  }

  // 3. 全域記憶體讀取 (Key: scratch_global_card_v1)
  const GLOBAL_KEY = "scratch_global_card_v1";
  function getRevealedSlots() {
    try {
      return JSON.parse(localStorage.getItem(GLOBAL_KEY)) || [];
    } catch(e) {
      return [];
    }
  }

  let revealedSlots = getRevealedSlots();

  // 4. Token 消耗額度記憶 (Key: scratch_token_used_TOKEN)
  const TOKEN_KEY = `scratch_token_used_${tokenParam}`;
  let tokenUsedCount = parseInt(localStorage.getItem(TOKEN_KEY) || "0", 10);
  let remainingAttempts = Math.max(0, maxAllowed - tokenUsedCount);

  // 顯示 Debug 資訊
  function updateDebugView() {
    document.getElementById('debugBar').textContent = `🔍 系統歷史紀錄 (號碼集合): [ ${getRevealedSlots().join(', ')} ]`;
  }

  const statusBar = document.getElementById('statusBar');
  if (isValid) {
    statusBar.classList.remove('preview');
    statusBar.innerHTML = `🎁 本次授權：剩餘 <span id="remainCount">${remainingAttempts}</span> 次刮卡機會`;
  } else {
    statusBar.classList.add('preview');
    statusBar.innerHTML = `👁️ 公開展示模式 (請使用專屬邀請連結進入刮卡)`;
  }

  let hasAlerted = false;
  const grid = document.getElementById('grid');

  // 5. 渲染 80 格卡面
  for (let i = 1; i <= 80; i++) {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.id = `slot-${i}`;
    slot.innerHTML = `<span class="slot-number">#${i}</span><span class="prize-text">${prizeMap[i-1]}</span>`;

    // 嚴格判定：如果號碼在歷史紀錄中，直接設為 revealed，絕不畫 Canvas
    if (revealedSlots.includes(i)) {
      slot.classList.add('revealed');
    } else {
      const canvas = document.createElement('canvas');
      canvas.width = 100;
      canvas.height = 100;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#666666';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fcc419';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`#${i}`, 50, 58);

      let isDrawing = false;

      canvas.addEventListener('pointerdown', (e) => {
        if (!isValid) {
          if (!hasAlerted) {
            hasAlerted = true;
            showModal("提示", "目前為展示模式，請點擊帶有專屬 Token 的邀請連結進行刮卡！");
          }
          return;
        }

        if (remainingAttempts <= 0) {
          if (!hasAlerted) {
            hasAlerted = true;
            showModal("提示", `您的專屬 ${maxAllowed} 次刮卡額度已用完！`);
          }
          return;
        }

        isDrawing = true;
        canvas.setPointerCapture(e.pointerId);
        scratch(e);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (isDrawing) scratch(e);
      });

      canvas.addEventListener('pointerup', (e) => {
        isDrawing = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
      });

      function scratch(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 16, 0, Math.PI * 2);
        ctx.fill();

        checkScratch(i, canvas, ctx, slot);
      }

      slot.appendChild(canvas);
    }

    grid.appendChild(slot);
  }

  updateDebugView();

  function checkScratch(slotNum, canvas, ctx, slot) {
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let transparent = 0;
    for (let i = 3; i < imgData.data.length; i += 4) {
      if (imgData.data[i] === 0) transparent++;
    }
    
    // 超過 25% 塗層抹去判定成功
    if (transparent > (imgData.data.length / 4) * 0.25) {
      canvas.remove();
      slot.classList.add('revealed');
      
      let currentRevealed = getRevealedSlots();
      if (!currentRevealed.includes(slotNum)) {
        // 1. 強制寫入全域 LocalStorage
        currentRevealed.push(slotNum);
        localStorage.setItem(GLOBAL_KEY, JSON.stringify(currentRevealed));
        
        // 2. 寫入 Token 消耗
        tokenUsedCount++;
        localStorage.setItem(TOKEN_KEY, tokenUsedCount.toString());
        
        remainingAttempts = Math.max(0, maxAllowed - tokenUsedCount);
        document.getElementById('remainCount').textContent = remainingAttempts;
        
        updateDebugView();
      }
      
      showModal(`第 ${slotNum} 刮結果`, prizeMap[slotNum - 1]);
    }
  }

  function showModal(title, msg) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }
</script>
</body>
</html>
