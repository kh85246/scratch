<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>80抽極限刮刮樂 - 配率公開版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { color: #fcc419; margin-bottom: 8px; font-size: 24px; text-align: center; }
    
    /* 頂部狀態列 */
    .status-bar { 
      background: #222; border: 1px solid #fcc419; padding: 10px 20px; 
      border-radius: 20px; margin: 10px 0; color: #fff; font-size: 15px; 
      box-shadow: 0 0 10px rgba(252, 196, 25, 0.2);
      text-align: center;
    }
    .status-bar span { color: #fcc419; font-weight: bold; font-size: 20px; margin: 0 4px; }
    .status-bar.preview { border-color: #888; color: #aaa; box-shadow: none; }
    
    /* 配率統計儀表板 */
    .dashboard {
      background: #1e1e1e; border: 1px solid #333; border-radius: 10px;
      padding: 15px; width: 100%; max-width: 600px; margin-bottom: 15px;
    }
    .dashboard h3 { color: #fcc419; font-size: 14px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
    .rate-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    .rate-table th { color: #aaa; padding: 4px; }
    .rate-table td { padding: 6px 4px; border-bottom: 1px solid #2a2a2a; }
    
    /* 80格網格 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      max-width: 600px;
      width: 100%;
    }
    
    .card-slot {
      position: relative;
      aspect-ratio: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 11px;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
    }

    .slot-number { position: absolute; color: #555; font-size: 10px; top: 2px; left: 4px; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; touch-action: none; }

    /* 展示模式下禁用刮畫布 */
    .disabled-canvas { pointer-events: none; opacity: 0.9; }

    /* 結果彈窗 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 10;
    }
    .modal-content { background: #222; padding: 20px; border-radius: 12px; border: 1px solid #fcc419; text-align: center; max-width: 320px; }
    .btn { background: #fcc419; color: #000; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>🔥 豪華 80 刮尊爵限定卡</h1>
  
  <div class="status-bar" id="statusBar">載入中...</div>

  <!-- 配率與剩餘統計面板 -->
  <div class="dashboard">
    <h3>📊 80 刮即時配率與獎項統計面板</h3>
    <table class="rate-table">
      <thead>
        <tr>
          <th>獎項名稱</th>
          <th>總數量</th>
          <th>初始機率</th>
        </tr>
      </thead>
      <tbody id="rateTableBody"></tbody>
    </table>
  </div>

  <div class="grid-container" id="grid"></div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle">提示</h3>
      <p id="modalMsg" style="margin: 15px 0; font-size: 16px; color: #fcc419;"></p>
      <button class="btn" onclick="closeModal()">確認</button>
    </div>
  </div>

<script>
  // ========================================================
  // 🎯 1. 管理者便利編輯區
  // ========================================================
  const SECRET_KEY = "MyLucky2026Key";

  const prizeConfig = [
    { rank: "特等獎", name: "🥇 iPad Air 256G", count: 1, color: "#ff4d4f" },
    { rank: "頭獎",   name: "🥈 $1,000 禮券",    count: 4, color: "#ffa940" },
    { rank: "貳獎",   name: "🥉 $200 禮券",      count: 10, color: "#ffec3d" },
    { rank: "普獎",   name: "🎁 免費飲料兌換券",  count: 20, color: "#73d13d" },
    { rank: "銘謝",   name: "☘️ 銘謝惠顧",       count: 45, color: "#8c8c8c" }
  ];

  // 自動建構 80 格獎項
  let prizeMap = [];
  prizeConfig.forEach(p => {
    for(let i = 0; i < p.count; i++) {
      prizeMap.push(p.name);
    }
  });

  // 渲染配率面板
  const rateTableBody = document.getElementById('rateTableBody');
  prizeConfig.forEach(p => {
    const rate = ((p.count / 80) * 100).toFixed(2);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color: ${p.color};">${p.name}</td>
      <td>${p.count} 個</td>
      <td>${rate}%</td>
    `;
    rateTableBody.appendChild(tr);
  });

  // ========================================================
  // 🔐 2. 防偽與驗證邏輯
  // ========================================================
  function generateToken(countStr) {
    const combined = countStr + SECRET_KEY;
    let hash = 0;
    for (let i = 0; i < combined.length; i++) {
      hash = (hash * 31 + combined.charCodeAt(i)) % 1000000;
    }
    return hash.toString(16);
  }

  const urlParams = new URLSearchParams(window.location.search);
  const countParam = urlParams.get('count') || "0";
  const tokenParam = urlParams.get('token') || "";

  let maxAllowed = 0;
  let isValid = false;

  if (countParam !== "0" && tokenParam === generateToken(countParam)) {
    maxAllowed = parseInt(countParam, 10);
    isValid = true;
  }

  const storageKey = `free_scratch_${tokenParam}`;
  let scratchedHistory = JSON.parse(localStorage.getItem(storageKey) || "[]");
  let remainingAttempts = Math.max(0, maxAllowed - scratchedHistory.length);

  // 更新頂部狀態列（完全無彈窗干擾）
  const statusBar = document.getElementById('statusBar');
  if (isValid) {
    statusBar.classList.remove('preview');
    statusBar.innerHTML = `🎁 本次授權：剩餘 <span id="remainCount">${remainingAttempts}</span> 次刮卡機會`;
  } else {
    statusBar.classList.add('preview');
    statusBar.innerHTML = `👁️ 當前狀態：公開展示模式 (僅供查看配率，請使用專屬連結刮卡)`;
  }

  // ========================================================
  // 🎨 3. 渲染 80 格刮刮樂網格
  // ========================================================
  const grid = document.getElementById('grid');

  for (let i = 1; i <= 80; i++) {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.innerHTML = `<span class="slot-number">${i}</span><span>${prizeMap[i-1]}</span>`;

    const canvas = document.createElement('canvas');
    canvas.width = 70;
    canvas.height = 70;
    const ctx = canvas.getContext('2d');

    const isAlreadyScratched = scratchedHistory.includes(i);

    if (!isAlreadyScratched) {
      ctx.fillStyle = '#888888';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`#${i}`, canvas.width / 2, canvas.height / 2 + 4);
    }

    // 若未授權，直接將畫布停用（無法觸發刮卡事件，也不會點擊彈窗）
    if (!isValid) {
      canvas.classList.add('disabled-canvas');
    }

    let isDrawing = false;
    ctx.globalCompositeOperation = 'destination-out';

    function scratch(e) {
      if (!isValid) return; // 展示模式直接忽略
      if (remainingAttempts <= 0 && !scratchedHistory.includes(i)) {
        showModal("提示", `您的專屬 ${maxAllowed} 次刮獎額度已用完囉！`);
        return;
      }
      if (!isDrawing) return;

      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      const y = (clientY - rect.top) * (canvas.height / rect.height);

      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fill();
      checkScratch(i, canvas, ctx);
    }

    if (isValid) {
      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('mousemove', scratch);
      window.addEventListener('mouseup', () => isDrawing = false);

      canvas.addEventListener('touchstart', () => isDrawing = true);
      canvas.addEventListener('touchmove', scratch);
      canvas.addEventListener('touchend', () => isDrawing = false);
    }

    if (!isAlreadyScratched) slot.appendChild(canvas);
    grid.appendChild(slot);
  }

  function checkScratch(slotNum, canvas, ctx) {
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let transparent = 0;
    for (let i = 3; i < imgData.data.length; i += 4) {
      if (imgData.data[i] === 0) transparent++;
    }
    
    if (transparent > (imgData.data.length / 4) * 0.4) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (!scratchedHistory.includes(slotNum)) {
        scratchedHistory.push(slotNum);
        localStorage.setItem(storageKey, JSON.stringify(scratchedHistory));
        remainingAttempts--;
        document.getElementById('remainCount').textContent = remainingAttempts;
      }
      
      showModal(`第 ${slotNum} 刮結果`, prizeMap[slotNum - 1]);
    }
  }

  function showModal(title, msg) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }
</script>
</body>
</html>
